name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate
      - run: pnpm check:fresh
      - run: pnpm test
      - run: pnpm build
      - name: Build artifacts are committed and fresh
        run: git diff --exit-code -- dist/registry.json dist/addresses.json
